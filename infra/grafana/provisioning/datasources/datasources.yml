apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: greenhouse_org
      defaultBucket: microclimate
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUX_TOKEN:-your-influxdb-token}
    editable: true
    isDefault: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: greenhouse_db
    user: ${POSTGRES_USER:-greenhouse_user}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-changeme}
    editable: true
    isDefault: false
