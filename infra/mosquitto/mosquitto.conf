# Mosquitto configuration for Smart Greenhouse Fleet

# Persistence
persistence true
persistence_location /mosquitto/data

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Listener for MQTT protocol
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Authentication
allow_anonymous true
acl_file /mosquitto/config/acl.conf

# Connection settings
max_connections -1
max_queued_messages 1000
