# Mosquitto ACL for Smart Greenhouse Management
# Canonical topic structure:
#   greenhouse-groups/{group_id}/greenhouses/{greenhouse_id}/zones/{zone_id}/{channel}
# Channels: telemetry, commands, alerts, state

# ---------------------------------------------------------------------------
# app user -- backend may publish commands and subscribe to telemetry/state
# ---------------------------------------------------------------------------

user app
topic readwrite greenhouse-groups/#

# ---------------------------------------------------------------------------
# simulator user -- internal/virtual devices publish telemetry and read commands
# ---------------------------------------------------------------------------

user simulator
topic read greenhouse-groups/+/greenhouses/+/zones/+/commands
topic write greenhouse-groups/+/greenhouses/+/zones/+/telemetry
topic write greenhouse-groups/+/greenhouses/+/zones/+/state

# ---------------------------------------------------------------------------
# wokwi user -- ESP32 simulator devices publish telemetry/state and read commands
# ---------------------------------------------------------------------------

user wokwi
topic read greenhouse-groups/+/greenhouses/+/zones/+/commands
topic write greenhouse-groups/+/greenhouses/+/zones/+/telemetry
topic write greenhouse-groups/+/greenhouses/+/zones/+/state
