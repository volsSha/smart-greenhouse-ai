# Mosquitto ACL for Smart Greenhouse Fleet
# Topic structure:
#   greenhouse/{greenhouse_id}/telemetry/{zone_id}/{sensor_type}
#   greenhouse/{greenhouse_id}/command/{zone_id}/{actuator_type}
#   greenhouse/{greenhouse_id}/status/{zone_id}

# ---------------------------------------------------------------------------
# simulator user  -- may publish telemetry and status, read-only on commands
# ---------------------------------------------------------------------------

# Publish telemetry data
user simulator
topic write greenhouse/+/telemetry/#

# Publish status updates
topic write greenhouse/+/status/#

# Read command topics (to confirm commands were received)
topic read greenhouse/+/command/#

# ---------------------------------------------------------------------------
# app user  -- full access: publish and subscribe all greenhouse topics
# ---------------------------------------------------------------------------

user app
topic readwrite greenhouse/#

# ---------------------------------------------------------------------------
# Deny rule: no user may publish command topics except the app
# (placed last as a global catch-all; Mosquitto applies the most specific
#  matching pattern, so the per-user rules above take precedence)
# ---------------------------------------------------------------------------

pattern write greenhouse/+/command/#
