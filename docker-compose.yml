services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: greenhouse-mosquitto
    restart: unless-stopped
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
    networks:
      - greenhouse-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-trixie
    container_name: greenhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenhouse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-greenhouse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - greenhouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenhouse_user} -d ${POSTGRES_DB:-greenhouse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  influxdb:
    image: influxdb:2.7.12
    container_name: greenhouse-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: greenhouse_admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-greenhouse_influx_pw}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-greenhouse_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-microclimate}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-your-influxdb-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - greenhouse-net
    healthcheck:
      test: ["CMD-SHELL", "influx ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenhouse-app
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-your-influxdb-token}
      MQTT_HOST: mosquitto
      API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:8080}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    volumes:
      - ./app:/app/app:ro
    networks:
      - greenhouse-net
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/api/health/live\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    name: greenhouse-postgres-data
  influxdb_data:
    name: greenhouse-influxdb-data
  influxdb_config:
    name: greenhouse-influxdb-config
  mosquitto_data:
    name: greenhouse-mosquitto-data
  mosquitto_log:
    name: greenhouse-mosquitto-log

networks:
  greenhouse-net:
    driver: bridge
    name: greenhouse-net
