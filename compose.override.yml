# Local development overrides
# This file is automatically loaded by Docker Compose when running
# `docker compose up` in development. It binds all ports to localhost only
# and switches the app to the dev image with hot reload.

services:
  mosquitto:
    ports:
      - "127.0.0.1:11883:1883"
      - "127.0.0.1:19001:9001"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  influxdb:
    ports:
      - "127.0.0.1:8086:8086"


  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./app:/app/app
      - ./locales:/app/locales
      - ./tests:/app/tests
    environment:
      DEBUG: "true"
      APP_SECRET: ${APP_SECRET:-smart-greenhouse-dev-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      MQTT_USERNAME: app